name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: checkboxes
    id: rules
    attributes:
      label: Project principles
      description: OpenSong stays free, local-first and legal.
      options:
        - label: This does not need a paid service, an account, a server we run, or tracking
          required: true
        - label: This does not involve scraping a service or bypassing DRM or paywalls
          required: true
